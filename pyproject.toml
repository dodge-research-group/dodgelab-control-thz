[project]

name = "dodgelab-control-thz"
version = "0.1.0a1"
description = "a GUI control system for thz control systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    { name = "Augusten Fairbairn", email = "augustenfairbairn@gmail.com" },
    { name = "Steve Dodge", email = "jsdodge@sfu.ca" },
    { name = "Juan David Santacruz Roca", email = "j.santacruzr@uniandes.edu.co" }
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]

minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
log_level = "INFO"
xfail_strict = true
strict_config = true

addopts = [
    "-ra",
    "--strict-markers",
]