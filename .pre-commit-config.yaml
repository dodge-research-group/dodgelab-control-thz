# Global configurations (Optional)
default_stages: [pre-commit]
exclude: '^dist/|^node_modules/'

# Pre-commit.ci configuration (Optional)
ci:
  autofix_prs: true
  autoupdate_schedule: monthly

# The core list of repositories and hooks to run
repos:
  # 1. Standard/General Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace      # Trims trailing whitespace
      - id: end-of-file-fixer        # Ensures files end with a newline
      - id: check-yaml               # Validates YAML syntax
      - id: check-added-large-files  # Prevents giant files from being committed
      - id: detect-private-key       # Blocks accidental private key leaks

  # 2. Modern Python Linter & Formatter (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff-check
        args: [--fix]                # Auto-fix lint violations where possible
      - id: ruff-format              # Consistent code formatting
