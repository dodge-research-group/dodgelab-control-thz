
name: Python CI


on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Permissions for the workflow
permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Hatch
      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      # Run Ruff, Mypy and Codespell
      - name: Run linting
        run: hatch run lint:check

      # Run pytest
      - name: Run tests
        run: hatch run test:run
